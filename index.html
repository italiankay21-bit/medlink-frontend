<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MedLink — Doctor Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>MedLink — Doctor Portal</h1>
  </header>

  <main>
    <h2>Log in</h2>
    <form id="loginForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Dr. John Smith" required />

      <label for="licenseId">License ID</label>
      <input type="text" id="licenseId" placeholder="DOC-2291" required />

      <label for="hospitalName">Hospital Name</label>
      <input type="text" id="hospitalName" placeholder="Hospital A" required />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <button type="submit" class="primary">Log In</button>
    </form>

    <div id="message" class="message"></div>

    <p style="text-align: center; margin-top: 1.5rem;">
      <a href="pharmacy-login.html">Pharmacy staff? Log in here</a>
    </p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
